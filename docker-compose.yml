services:
  dashboard:
    image: php:8.3-apache
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "8090:80"    # Nginx Proxy Manager redirige le sous-domaine vers ce port
    volumes:
      - ./src:/var/www/html:ro   # lecture seule : le conteneur ne peut pas modifier le code
      - ./php.ini:/usr/local/etc/php/conf.d/dashboard.ini:ro   # erreurs PHP dans les logs, jamais dans la page
      - ./bin:/app/bin:ro        # script du cron, hors de la racine web
      - ./data:/data             # seul dossier inscriptible : la base SQLite
    env_file:
      - .env   # secrets (token Proxmox) : jamais dans src/, qui est la racine web publique
    environment:
      - TZ=Europe/Paris