services:
  dashboard:
    image: php:8.3-apache
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "8090:80"    # Nginx Proxy Manager redirige le sous-domaine vers ce port
    volumes:
      - ./src:/var/www/html:ro   # lecture seule : le conteneur ne peut pas modifier le code
    environment:
      - TZ=Europe/Paris